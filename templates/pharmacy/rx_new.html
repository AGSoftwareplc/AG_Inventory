{% extends 'base.html' %}{% block title %}Register prescription{% endblock %}
{% block content %}{% include 'pharmacy/_tabs.html' %}
<h1>Register a prescription</h1>
<form method="post" class="card" enctype="multipart/form-data">{{ csrf() }}{{ once() }}
<div class="grid">
  <div><label>Patient * <a href="{{ url_for('pharmacy.patient', next=url_for('pharmacy.rx_new')) }}">+ new</a></label><select name="patient_id" required><option value="">Choose…</option>
    {% for p in patients %}<option value="{{ p.id }}" {{ 'selected' if sel_patient == p.id }}>{{ p.name }} {{ p.phone }}</option>{% endfor %}</select></div>
  <div><label>Prescriber * <a href="{{ url_for('pharmacy.prescribers', next=url_for('pharmacy.rx_new')) }}">+ new</a></label><select name="prescriber_id" required><option value="">Choose…</option>
    {% for p in prescribers %}<option value="{{ p.id }}" {{ 'selected' if sel_prescriber == p.id }}>{{ p.name }}{{ ' · ' ~ p.facility if p.facility }}</option>{% endfor %}</select></div>
  <div><label>Prescription date</label><input type="date" name="date" value="{{ f.date or today }}" max="{{ today }}"></div>
  <div><label>Number on the prescription</label><input name="rx_no" value="{{ f.rx_no or '' }}"></div>
  <div><label>EFDA form serial no. <span class="muted">(controlled medicines)</span></label><input name="form_serial" value="{{ f.form_serial or '' }}"></div>
  <div><label>Scan or photo (PDF, JPG, PNG, up to 10 MB) <span class="muted">required for controlled</span></label><input type="file" name="scan" accept=".pdf,.jpg,.jpeg,.png"></div>
  <div class="wide"><label>Notes</label><input name="notes" value="{{ f.notes or '' }}"></div>
  <div class="wide"><label class="inline"><input type="checkbox" name="dup_ok" value="1"> It is a new prescription (the same number was already registered for this patient)</label></div>
</div>
<div class="tablewrap"><table id="lines"><tr><th>Medicine</th><th class="n">Quantity</th><th>Dose</th><th>Frequency</th><th>Duration</th><th>Instructions</th><th></th></tr></table></div>
<div class="actions"><button type="button" class="light small" onclick="addLine()">+ Add medicine</button></div>
<div class="actions"><button>Register prescription</button> <a class="btn light" href="{{ url_for('pharmacy.prescriptions') }}">Cancel</a></div>
</form>
<template id="tpl"><tr>
  <td><select name="pid" style="min-width:240px"><option value="">Choose medicine…</option>
  {% for p in products %}<option value="{{ p.id }}">{{ p.name }}{{ ' ' ~ p.strength if p.strength and p.strength not in p.name }} ({{ p.rx_class or 'general' }}, in stock {{ p.stock|qty }} {{ p.unit }})</option>{% endfor %}</select></td>
  <td class="n"><input name="qty" inputmode="decimal" style="width:90px;text-align:right"></td>
  <td><input name="dose" placeholder="1 tablet" style="width:110px"></td>
  <td><input name="frequency" placeholder="3 times a day" style="width:130px"></td>
  <td><input name="duration" placeholder="7 days" style="width:90px"></td>
  <td><input name="instructions" placeholder="after food" style="width:150px"></td>
  <td><button type="button" class="x" onclick="this.closest('tr').remove()">×</button></td></tr></template>
{% endblock %}
{% block scripts %}<script>
function addLine() { document.getElementById('lines').appendChild(document.getElementById('tpl').content.firstElementChild.cloneNode(true)); }
addLine(); addLine();
</script>{% endblock %}
