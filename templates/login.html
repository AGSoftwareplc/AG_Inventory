{% extends 'base.html' %}{% block title %}Log in{% endblock %}{% block bodyclass %}loginpage{% endblock %}
{% block content %}
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="logincard">
  <img src="{{ url_for('static', filename='ag-mark.png') }}?v=3" alt="AG Software" class="loginlogo">
  <h1>AG <span>Inventory</span></h1>
  <p class="tagline">Smart stock. Bright business.</p>
  <form method="post">{{ csrf() }}
    <p><label>Username</label><input name="username" autofocus required autocomplete="username"></p>
    <p><label>Password</label><input name="password" type="password" required autocomplete="current-password"></p>
    <button class="big glowbtn" style="width:100%">Log in</button>
  </form>
  <p class="loginfoot">Powered by <b>AG Software PLC</b></p>
</div>
{% endblock %}
