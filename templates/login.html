{% extends 'base.html' %}{% block title %}Log in{% endblock %}
{% block content %}
<div class="card login">
  <h1>{{ setting('shop_name') }}</h1>
  <p class="muted">Log in to AG Inventory</p>
  <form method="post">{{ csrf() }}
    <p><label>Username</label><input name="username" autofocus required autocomplete="username"></p>
    <p><label>Password</label><input name="password" type="password" required autocomplete="current-password"></p>
    <button class="big" style="width:100%">Log in</button>
  </form>
</div>
{% endblock %}
