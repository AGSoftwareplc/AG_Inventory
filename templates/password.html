{% extends 'base.html' %}{% block title %}Change password{% endblock %}
{% block content %}
<div class="card login"><h1>Change password</h1>
<form method="post">{{ csrf() }}
  <p><label>Current password</label><input type="password" name="current" required></p>
  <p><label>New password (6+ characters)</label><input type="password" name="new" required minlength="6"></p>
  <p><label>Repeat new password</label><input type="password" name="confirm" required minlength="6"></p>
  <button>Save</button>
</form></div>
{% endblock %}
